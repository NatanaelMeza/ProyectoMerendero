<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Registrarse </title>
        <link rel="stylesheet" href="Css/registro.css">
    </head>
    <body>
        <div>
            <h1> Registrarse para Ayudar</h1>

            <div class="filaA">
		        <input type="text" size="30" placeholder="Nombre"/> <!--placeholder es un texto que aparece dentro de un campo antes de que el usuario escriba algo--> 
		        <input type="text" size="30" placeholder="Apellido" /> 
                <input type="text" size="40" placeholder="Correo Electrónico"/><br/>
            </div>
            
            <div class="filaB">
                <input type="text" size="30" placeholder="Teléfono (opcional)" /> 
                <input type="text" size="40" placeholder="Barrio o dirección (opcional)"/>
            </div>
		    

            <label>¿Como querés ayudar? </label> <br/>
		    <input type="checkbox" name="ayuda" value="si" id="ropa"/>
		    <label for="ropa">Ropa</label><br/>

		    <input type="checkbox" name="ayuda" value="si" id="comida"/> 
		    <label for="comida">Alimentos</label> <br/>
		
		    <input type="checkbox" name="ayuda" value="si" id="plata"/> 
		    <label for="plata">Dinero</label> <br/>
		
		    <input type="checkbox" name="ayuda" value="si" id="tiempo"/> 
		    <label for="tiempo">Tiempo como voluntarios</label> <br/>

		    <input type="checkbox" name="ayuda" value="si" id="Otros"/> 
		    <label for="Otros">Otros</label> <br/><br/>

            <label for="met">Elegi el Merendero </label>
		        <select name="met" id="met"> 
			        <option value=" " selected="selected">Selecciona</option>
                    <option value="1" >Luz de Esperanza</option>
                    <option value="2" >Solcitos de Ruca Antu</option>
                    <option value="3" >Los Pequeños Gigantes</option>
                    <option value="4" >San Lorenzo Sur</option>
		        </select> <br/> <br/>

            <input type="submit" name="enviar" value="Registrarse" />
        </div>
    </body>
</html>
