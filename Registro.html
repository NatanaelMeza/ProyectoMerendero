<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Registrarse </title>
        <link rel="stylesheet" href="Css/registro.css">
    </head>
    <body>
        <div class="caja">
            <div class="cajita">
                <h3>Registrate acá!</h3>
            </div>
        
            <div class="formulario">
                <h2> Registrarse para Ayudar</h2>

                <div class="filaA">
		            <input type="text" size="30" placeholder="Nombre"/> <!--placeholder es un texto que aparece dentro de un campo antes de que el usuario escriba algo--> 
		            <input type="text" size="30" placeholder="Apellido" /> <br/>
                </div>
            
                <div class="filaB">
                    <input type="text" size="40" placeholder="Correo Electrónico"/>
                    <input type="text" size="30" placeholder="Teléfono (opcional)"/> <br/>
                </div>
		    

                <p>¿Como querés ayudar? </p> 
                <div class="opciones">
		            <input type="checkbox" name="ayuda" value="si" id="ropa"/>
		            <label for="ropa">Ropa</label><br/>

                    <input type="checkbox" name="ayuda" value="si" id="comida"/> 
                    <label for="comida">Alimentos</label> <br/>
		
                    <input type="checkbox" name="ayuda" value="si" id="plata"/> 
                    <label for="plata">Dinero</label> <br/>
            
                    <input type="checkbox" name="ayuda" value="si" id="tiempo"/> 
                    <label for="tiempo">Tiempo como voluntarios</label> <br/>
                    <input type="checkbox" name="ayuda" value="si" id="Otros"/> 
                    <label for="Otros">Otros</label> <br/><br/><br/>
                </div>

                <label for="met">Elegí el Merendero: </label>
		            <select name="met" id="met"> 
			            <option value=" " selected="selected">Selecciona</option>
                        <option value="1" >Luz de Esperanza</option>
                        <option value="2" >Solcitos de Ruca Antu</option>
                        <option value="3" >Los Pequeños Gigantes</option>
                        <option value="4" >San Lorenzo Sur</option>
		            </select> <br/> 
            
                <p>Días y horarios en los que podés colaborar:</p>
                <input type="text" size="70" placeholder="Ejemplo: Martes y Jueves de 10 a 14 hs."/> <br/> 

                <input type="text" size="70" placeholder="Contanos un poco más sobre cómo te gustaría ayudar"/> <br/> 
            
                <input type="checkbox" name="consentimiento" id="acepto"/>
                <label for="acepto">Acepto compartir mis datos para contacto.</label> <br/> <br/>

                <input type="submit" value="Enviar" name="Enviar" class="botón"/>
                <input type="reset" value="Cancelar" name="Cancelar" class="botón"/>
            </div>
        </div>
    </body>
</html>
