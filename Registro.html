<html>
    <head>
        <title> Registrarse </title>
        <link rel="stylesheet" href="Css/registro.css">
    </head>
    <body>
        <h1> Registrarse para ayudar</h1>
    <div class="nombre">
        <label for="nombre">Nombre:</label><br/>
		<input type="text" name="nombre" id="nombre" size="55" maxlength="50"/> 
    </div>
    <div class="apellido">
        <label for="apellido">Apellido:</label><br/>
		<input type="text" name="apellido" id="apellido" /> <br/>
    </div>
        <label for="correo">Correo electrónico:</label><br/>
		<input type="text" name="correo" id="correo" /> <br/>

        <label for="tel">Telefono (opcional)</label><br/>
		<input type="text" name="tel" id="tel" /> <br/><br/>

        <label>¿Como queres ayudar? </label> <br/>
		<input type="radio" name="hambur" value="si" id="ropa" checked="checked"/>
		<label for="ropa">Ropa</label><br/>

		<input type="radio" name="hambur" value="si" id="comida"/> 
		<label for="comida">Alimentos</label> <br/>
		
		<input type="radio" name="hambur" value="si" id="plata"/> 
		<label for="plata">Dinero</label> <br/>
		
		<input type="radio" name="hambur" value="si" id="tiempo"/> 
		<label for="tiempo">Tiempo como voluntarios</label> <br/>

		<input type="radio" name="hambur" value="si" id="Otros"/> 
		<label for="Otros">Otros</label> <br/><br/>

        <label for="met">Elegi el Merendero: </label>
		    <select name="met" id="met"> 
			    <option value="" selected="selected">selecciona</option>
                <option value="1" >Luz de Esperanza</option>
                <option value="2" >Ruca Antu</option>
                <option value="3" >Los Pequeños Gigantes</option>
                <option value="4" >Merendero 4</option>
		    </select> <br/> <br/>

        <input type="submit" name="enviar" value="registrar" />

    </body>
</html>
